<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#262624" />
    <meta name="description" content="TgVault — локальный архиватор Telegram-каналов и чатов" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23262624'/%3E%3Cpath d='M32 10 51 18v13.6C51 43 43.4 50.6 32 54.2 20.6 50.6 13 43 13 31.6V18z' fill='none' stroke='%23D97757' stroke-width='3.2' stroke-linejoin='round'/%3E%3Cpath d='M32 24v14M25.5 31.5h13' stroke='%23D97757' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>TgVault — архив Telegram</title>
    <script>
      // Applies the persisted theme before first paint — no flash of the wrong theme.
      // `?theme=light|dark|system` overrides it for this page load only (headless
      // screenshots have no localStorage); the stored preference is never written here.
      (function () {
        try {
          var valid = { light: 1, dark: 1, system: 1 };
          var param = new URLSearchParams(window.location.search).get('theme');
          var stored = window.localStorage.getItem('tgvault.theme');
          var mode = valid[param] ? param : valid[stored] ? stored : 'dark';
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : mode;
          document.documentElement.setAttribute('data-theme', resolved);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'light' ? '#FAF9F5' : '#262624');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
